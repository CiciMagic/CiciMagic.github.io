#-------------------------------
# General Site Settings
title: Magic Planet
logo: # You can add own logo. For example '/images/logo.png'.
description: Magic Planet is a modern and minimal Jekyll theme for sharing your ideas.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://cicimagic.github.io" # the base hostname & protocol for your site


#-------------------------------
# Author Settings
author:
  name: Magic Sun
  image: '/images/profile.jpg'
  avatar: '/images/profile.jpg'
  # 首页顶部作者简介（保持原内容）
  home_description: I’m a designer and natural strategist, drawn to beautiful things and curious about what makes them work. Welcome to my little idea garden.
  # 底部 About Me（新内容）
  description: Magic Sun is a graduate from Harvard Graduate School of Design with a strong interest in sustainable design, striving to create meaningful change toward a low-carbon society at both strategic and practical levels.


#-------------------------------
# Contact links

# Example of adding a new link to the footer - {icon: "ion-logo-github", link: "https://github.com"}
# Other icons can be found at https://ionicons.com/v4/
contact:
- {name: "LinkedIn", icon: "ion-logo-linkedin", link: "https://www.linkedin.com/in/magicsun/en"}
- {name: "Instagram", icon: "ion-logo-instagram", link: "https://www.instagram.com/magicsun961/?hl=en"}
- {name: "Email", icon: "ion-ios-mail", link: "mailto:magicsun961@gmail.com"}


#-------------------------------
# Comment Section (Disqus)
disqus-identifier: # Disqus 评论已关闭。如需启用，请填入你的 Disqus shortname，例如 disqus-identifier: my-shortname


#-------------------------------
# Newsletter
mailchimp: true # To enable the mailchimp form, use the value true. To turn off use the value false.
mailchimp-identifier: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e
mailchimp-description: Subscribe to our newsletter and we’ll send you the emails of latest posts.


#-------------------------------
# Google Analytics
google-analytics: # Add your identifier. For example UA-99631805-1.


#-------------------------------
# Build settings
markdown: kramdown
permalink: ':title/'

# Collections
collections:
  gallery:
    output: true
    permalink: /gallery/:title/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging

paginate: 9
paginate_path: "/page/:num"

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

sass:
  sass_dir: _sass
  style: compressed